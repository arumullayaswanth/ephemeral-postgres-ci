name: CI

on:
  pull_request:
  workflow_dispatch:

# Required for OIDC authentication to AWS (to read the DB secret).
permissions:
  id-token: write
  contents: read

jobs:
  integration:
    # Self-hosted runner in the VPC (needs private RDS access).
    runs-on: self-hosted

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      # Name of the Secrets Manager secret Terraform created (output db_secret_name).
      DB_SECRET_NAME: ${{ vars.DB_SECRET_NAME }}
      # One ephemeral database per run keeps concurrent runs isolated.
      PGDATABASE: ci_run_${{ github.run_id }}_${{ github.run_attempt }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Fetch the DB connection details Terraform stored in Secrets Manager and
      # expose them as PostgreSQL environment variables for the rest of the job.
      - name: Load DB credentials from Secrets Manager
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$DB_SECRET_NAME" \
            --region "$AWS_REGION" \
            --query SecretString --output text)

          echo "::add-mask::$(echo "$SECRET_JSON" | jq -r .PGPASSWORD)"

          {
            echo "PGHOST=$(echo "$SECRET_JSON" | jq -r .PGHOST)"
            echo "PGPORT=$(echo "$SECRET_JSON" | jq -r .PGPORT)"
            echo "PGUSER=$(echo "$SECRET_JSON" | jq -r .PGUSER)"
            echo "PGPASSWORD=$(echo "$SECRET_JSON" | jq -r .PGPASSWORD)"
            echo "PGADMINDB=$(echo "$SECRET_JSON" | jq -r .PGADMINDB)"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create ephemeral database
        run: |
          . .venv/bin/activate
          python -m ci.create_database

      - name: Run migrations
        run: |
          . .venv/bin/activate
          python -m ci.migrate

      # Print the full contents of the ephemeral database.
      - name: Inspect database (after migrations)
        run: |
          echo "=================== DATABASES ==================="
          psql -c "\l"

          echo "=================== TABLES ($PGDATABASE) ==================="
          psql -d "$PGDATABASE" -c "\dt"

          echo "=================== TABLE COUNT ==================="
          psql -d "$PGDATABASE" -t -c \
            "SELECT count(*) AS table_count FROM information_schema.tables WHERE table_schema='public';"

          echo "=================== ROW COUNT PER TABLE ==================="
          psql -d "$PGDATABASE" -c \
            "SELECT relname AS table, n_live_tup AS rows FROM pg_stat_user_tables ORDER BY relname;"

          echo "=================== DATA IN EACH TABLE ==================="
          for t in $(psql -d "$PGDATABASE" -t -A -c \
            "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename;"); do
            echo "----- $t -----"
            psql -d "$PGDATABASE" -c "SELECT * FROM \"$t\";"
          done

      # Difference between the base 'postgres' DB and this ephemeral 'ci_run_<id>' DB.
      - name: Diff ephemeral DB vs base postgres DB
        run: |
          echo "=================== TABLES in base '$PGADMINDB' ==================="
          psql -d "$PGADMINDB" -t -A -c \
            "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename;" \
            | sort > /tmp/base_tables.txt
          cat /tmp/base_tables.txt || echo "(none)"

          echo "=================== TABLES in ephemeral '$PGDATABASE' ==================="
          psql -d "$PGDATABASE" -t -A -c \
            "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename;" \
            | sort > /tmp/ephemeral_tables.txt
          cat /tmp/ephemeral_tables.txt || echo "(none)"

          echo "=================== DIFF: tables ==================="
          echo "--- Tables ONLY in ephemeral (added by migrations) ---"
          comm -23 /tmp/ephemeral_tables.txt /tmp/base_tables.txt || echo "(none)"
          echo "--- Tables ONLY in base postgres ---"
          comm -13 /tmp/ephemeral_tables.txt /tmp/base_tables.txt || echo "(none)"
          echo "--- Tables in BOTH ---"
          comm -12 /tmp/ephemeral_tables.txt /tmp/base_tables.txt || echo "(none)"

          echo "=================== DIFF: row counts (base vs ephemeral) ==================="
          printf "%-25s %-12s %-12s\n" "TABLE" "BASE_ROWS" "EPHEMERAL_ROWS"
          for t in $(cat /tmp/base_tables.txt /tmp/ephemeral_tables.txt | sort -u); do
            base=$(psql -d "$PGADMINDB"  -t -A -c "SELECT count(*) FROM \"$t\";" 2>/dev/null || echo "-")
            eph=$(psql  -d "$PGDATABASE" -t -A -c "SELECT count(*) FROM \"$t\";" 2>/dev/null || echo "-")
            printf "%-25s %-12s %-12s\n" "$t" "$base" "$eph"
          done

      - name: Run integration tests
        run: |
          . .venv/bin/activate
          pytest -v

      # Cleanup runs even if tests fail, so no orphaned databases are left.
      - name: Drop ephemeral database
        if: always()
        run: |
          . .venv/bin/activate
          python -m ci.drop_database
